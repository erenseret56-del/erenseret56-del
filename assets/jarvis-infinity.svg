<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title description">
  <title id="title">Sai Ruthvik Reddy — AI developer operating system</title>
  <desc id="description">A midnight terminal card with Sai Ruthvik Reddy's identity on the left and a cyan holographic infinity core with animated HUD rings on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030812"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#02050b"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop stop-color="#bdfbff" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#4ce8ff" stop-opacity=".55"/>
      <stop offset=".65" stop-color="#1576ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0a1f4e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="infinityStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ddfeff"/>
      <stop offset=".28" stop-color="#50ecff"/>
      <stop offset=".68" stop-color="#1388ff"/>
      <stop offset="1" stop-color="#8cf9ff"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#18314a" stroke-opacity=".48"/>
    </pattern>
  </defs>

  <rect width="1440" height="850" fill="url(#background)"/>
  <rect x="0" y="68" width="1440" height="720" fill="url(#grid)" opacity=".78"/>
  <rect width="1440" height="68" fill="#0a1625"/>
  <path d="M0 68H1440M0 788H1440" stroke="#28475e"/>

  <g fill="#7ed6ff">
    <circle cx="40" cy="34" r="7" fill="#5af1d0"/><circle cx="64" cy="34" r="7" fill="#58acff"/><circle cx="88" cy="34" r="7" fill="#466178"/>
  </g>
  <g font-family="Consolas, Menlo, monospace">
    <text x="120" y="42" fill="#c4d7e8" font-size="21" letter-spacing="1.2">RUTHVIK / PERSONAL OPERATING SYSTEM</text>
    <text x="1120" y="42" fill="#62efff" font-size="18" letter-spacing="1.2">PROFILE.SYS  /  01</text>
  </g>

  <g font-family="Consolas, Menlo, monospace">
    <rect x="48" y="122" width="234" height="36" fill="#104b59" opacity=".92"/>
    <text x="63" y="147" fill="#82fbff" font-size="20" letter-spacing=".8">DEVELOPER EDITION</text>
    <text x="48" y="211" fill="#55adff" font-size="24">&gt; boot identity</text>
    <text x="48" y="319" fill="#f1f8ff" font-family="Segoe UI, sans-serif" font-size="79" letter-spacing="-3">SAI RUTHVIK</text>
    <text x="48" y="418" fill="#62efff" font-family="Segoe UI, sans-serif" font-size="91" letter-spacing="-4">REDDY</text>
    <path d="M52 442H174" stroke="#62efff" stroke-width="4"/>
    <text x="48" y="503" fill="#e6f2fb" font-size="29">FULL STACK DEVELOPER</text>
    <text x="48" y="542" fill="#aac2dc" font-size="23">UI/UX ENTHUSIAST  /  BUILDER</text>
    <text x="48" y="631" fill="#e6f2fb" font-size="30">Build with intent.</text>
    <text x="48" y="676" fill="#9db6cf" font-size="22">Hyderabad, India</text>
    <text x="48" y="714" fill="#55adff" font-size="22">@erenseret56-del</text>
  </g>

  <g>
    <rect x="804" y="112" width="586" height="628" fill="#030b16" stroke="#1d526d"/>
    <path d="M804 174V112H866M1328 740H1390V678" fill="none" stroke="#62efff" stroke-width="3"/>
    <path d="M804 112H866" stroke="#62efff" stroke-width="3"/>
    <rect x="812" y="120" width="570" height="612" fill="url(#coreGlow)" opacity=".8">
      <animate attributeName="opacity" values=".55;.95;.55" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Consolas, Menlo, monospace">
      <text x="836" y="151" fill="#89faff" font-size="16" letter-spacing="2">AI CORE / INFINITY</text>
      <text x="1348" y="151" fill="#4b91cf" font-size="14" text-anchor="end">ONLINE</text>
      <path d="M836 164H1350" stroke="#155a78"/>
    </g>

    <g transform="translate(1097 428)">
      <circle r="255" fill="none" stroke="#0d3857" stroke-width="1" stroke-dasharray="2 11"/>
      <circle r="212" fill="none" stroke="#1580ae" stroke-width="2" stroke-dasharray="72 26 8 24" opacity=".72">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="179" fill="none" stroke="#4ce8ff" stroke-width="1.4" stroke-dasharray="9 20" opacity=".8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="142" fill="none" stroke="#136dbe" stroke-width="1" stroke-dasharray="122 42" opacity=".75">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="105" fill="none" stroke="#55eaff" stroke-width="1" opacity=".5">
        <animate attributeName="r" values="92;118;92" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".18;.65;.18" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      <g fill="#69f4ff" filter="url(#softGlow)">
        <circle r="5" cx="0" cy="-212"><animateMotion dur="7s" repeatCount="indefinite" path="M0 -212A212 212 0 1 1 0 212A212 212 0 1 1 0 -212"/></circle>
        <circle r="3" cx="0" cy="142"><animateMotion dur="5s" repeatCount="indefinite" path="M0 142A142 142 0 1 0 0 -142A142 142 0 1 0 0 142"/></circle>
        <circle r="3" cx="-179" cy="0"><animateMotion dur="8s" repeatCount="indefinite" path="M-179 0A179 179 0 1 1 179 0A179 179 0 1 1 -179 0"/></circle>
      </g>

      <g filter="url(#wideGlow)" opacity=".8">
        <path d="M0 -7 C-57 -92 -163 -92 -205 0 C-163 92 -57 92 0 7 C57 -92 163 -92 205 0 C163 92 57 92 0 -7" fill="none" stroke="#46dfff" stroke-width="16" opacity=".22"/>
      </g>
      <g filter="url(#softGlow)">
        <path d="M0 -7 C-57 -92 -163 -92 -205 0 C-163 92 -57 92 0 7 C57 -92 163 -92 205 0 C163 92 57 92 0 -7" fill="none" stroke="url(#infinityStroke)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="5s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="8;11;8" dur="2.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle r="12" fill="#bcfdff" filter="url(#softGlow)">
        <animate attributeName="r" values="8;15;8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" fill="none" stroke="#8bf8ff" stroke-width="1" opacity=".7">
        <animate attributeName="r" values="24;52;24" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0;.8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#68dff5">
      <text x="836" y="704">SYSTEM / NOMINAL</text>
      <text x="1352" y="704" text-anchor="end">∞ / 001</text>
    </g>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="19">
    <text x="48" y="826" fill="#62efff">01 / IDENTITY</text>
    <text x="328" y="826" fill="#9cb8d2">02 / TOOLKIT</text>
    <text x="608" y="826" fill="#9cb8d2">03 / BUILDS</text>
    <text x="1140" y="826" fill="#55adff">FOCUS &gt; FRICTION</text>
  </g>
</svg>
