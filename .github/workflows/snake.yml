name: Generate contribution snake

on:
  schedule:
    - cron: '17 0 * * *' # Daily at 05:47 Asia/Kolkata; GitHub may delay schedules.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'erenseret56-del/erenseret56-del'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Generate SVG and GIF animations
        uses: Platane/snk@v3
        with:
          github_user_name: erenseret56-del
          outputs: |
            dist/github-snake.svg?color_snake=%23059669
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2355adff&color_dots=%230d1826,%230b493a,%23107855,%2326bc82,%2364edb4
            dist/github-snake.gif?color_snake=%2355adff&color_dots=%230d1826,%230b493a,%23107855,%2326bc82,%2364edb4&color_background=%23080e1b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all generated outputs
        run: |
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          test -s dist/github-snake.gif

      - name: Publish animations to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          force_orphan: false
          commit_message: 'chore: refresh contribution animations'
